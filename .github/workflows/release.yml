name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSI
            os: windows-latest
            rust-targets: ""
            args: --bundles msi
            artifact-name: release-windows-msi
            artifact-path: src-tauri/target/release/bundle/msi/*

          - name: macOS Universal DMG
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifact-name: release-macos-dmg
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

          - name: Linux AppImage
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage
            artifact-name: release-linux-appimage
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare updater config
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pubkey = process.env.TAURI_UPDATER_PUBKEY?.trim();
          if (!pubkey) {
            throw new Error("Missing TAURI_UPDATER_PUBKEY secret");
          }

          fs.writeFileSync(
            ".tauri-updater-config.json",
            `${JSON.stringify({ plugins: { updater: { pubkey } } }, null, 2)}\n`,
          );
          NODE

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret" >&2
            exit 1
          fi

          printf 'refract updater signing preflight' > updater-signing-preflight.txt
          bun tauri signer sign --password="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" updater-signing-preflight.txt >/dev/null
          rm updater-signing-preflight.txt updater-signing-preflight.txt.sig

      - name: Build application
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }} --config .tauri-updater-config.json

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail

          rm -rf release-upload
          mkdir -p release-upload

          find release-assets -type f \( \
            -name '*.msi' -o \
            -name '*.msi.sig' -o \
            -name '*.msi.zip' -o \
            -name '*.msi.zip.sig' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.AppImage.sig' -o \
            -name '*.AppImage.tar.gz' -o \
            -name '*.AppImage.tar.gz.sig' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-upload/$(basename "$file")"
          done

          find release-upload -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate release notes from commits
        run: |
          set -euo pipefail

          current_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"
          short_sha="$(git rev-parse --short "$current_commit")"

          if [ -n "$previous_tag" ]; then
            git log --no-merges --pretty=format:'- %s (%h)' "$previous_tag..$RELEASE_TAG" \
              | grep -vE '^- (update|chore): Bump version' > release-changes.md || true
          else
            git log --no-merges --pretty=format:'- %s (%h)' "$RELEASE_TAG" > release-changes.md || true
          fi
          if [ ! -s release-changes.md ]; then
            echo "- No code changes recorded since the previous release." > release-changes.md
          fi

          {
            if [ -n "$previous_tag" ]; then
              echo "Changes since $previous_tag."
            else
              echo "Initial release."
            fi
            echo
            echo "## Changes"
            cat release-changes.md
            echo
            echo "## Build"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$short_sha\`"
          } > release-notes.md

      - name: Generate updater manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const assetsDir = "release-upload";
          const releaseTag = process.env.RELEASE_TAG;
          const version = releaseTag.replace(/^v/, "");
          const repo = process.env.GH_REPO;
          const files = fs.readdirSync(assetsDir).filter((name) => {
            return fs.statSync(path.join(assetsDir, name)).isFile();
          });

          const releaseAssetUrl = (name) => {
            return `https://github.com/${repo}/releases/download/${encodeURIComponent(releaseTag)}/${encodeURIComponent(name)}`;
          };
          const find = (...patterns) => files.find((name) => patterns.some((pattern) => pattern.test(name)));
          const signatureFor = (asset) => {
            const sigFile = `${asset}.sig`;
            if (!files.includes(sigFile)) throw new Error(`Missing updater signature: ${sigFile}`);
            return fs.readFileSync(path.join(assetsDir, sigFile), "utf8").trim();
          };
          const platformEntry = (asset) => ({
            signature: signatureFor(asset),
            url: releaseAssetUrl(asset),
          });

          const platforms = {};

          const windowsMsi = find(/\.msi\.zip$/i);
          if (windowsMsi) platforms["windows-x86_64-msi"] = platformEntry(windowsMsi);

          const windowsNsis = find(/-setup\.exe\.zip$/i, /\.exe\.zip$/i);
          if (windowsNsis) platforms["windows-x86_64-nsis"] = platformEntry(windowsNsis);

          const macUniversal = find(/universal.*\.app\.tar\.gz$/i);
          const macArm64 = find(/aarch64.*\.app\.tar\.gz$/i) ?? macUniversal ?? find(/\.app\.tar\.gz$/i);
          const macX64 = find(/(?:x64|x86_64).*\.app\.tar\.gz$/i) ?? macUniversal ?? macArm64;
          if (macArm64) platforms["darwin-aarch64"] = platformEntry(macArm64);
          if (macX64) platforms["darwin-x86_64"] = platformEntry(macX64);

          const linuxAppImage = find(/\.AppImage\.tar\.gz$/i);
          if (linuxAppImage) platforms["linux-x86_64-appimage"] = platformEntry(linuxAppImage);

          const missing = [];
          if (!windowsMsi && !windowsNsis) missing.push("Windows updater archive (*.msi.zip or *-setup.exe.zip)");
          if (!macArm64 && !macX64) missing.push("macOS updater archive (*.app.tar.gz)");
          if (!linuxAppImage) missing.push("Linux updater archive (*.AppImage.tar.gz)");
          if (missing.length) {
            throw new Error(`Missing updater artifacts:\n- ${missing.join("\n- ")}`);
          }

          const manifest = {
            version,
            notes: fs.existsSync("release-notes.md") ? fs.readFileSync("release-notes.md", "utf8").trim() : "",
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync(path.join(assetsDir, "latest.json"), `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Generated latest.json for ${Object.keys(platforms).join(", ")}`);
          NODE

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Refract $RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-upload/* --clobber
          else
            gh release create "$RELEASE_TAG" release-upload/* \
              --verify-tag \
              --title "Refract $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
